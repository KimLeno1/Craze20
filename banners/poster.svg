  <text x="280" y="2960" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="72" font-weight="bold" fill="#00D1FF">PAY FOR ME</text>
  <text x="280" y="3060" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="48" font-weight="400" fill="#9ca3af">Get sponsored by friends</text>

  <rect x="900" y="2800" width="600" height="400" rx="40" fill="white" fill-opacity="0.05" stroke="white" stroke-opacity="0.1" stroke-width="4"/>
  <text x="980" y="2960" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="72" font-weight="bold" fill="#EC4899">AI STYLIST</text>
  <text x="980" y="3060" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="48" font-weight="400" fill="#9ca3af">Your personal fashion guru</text>

