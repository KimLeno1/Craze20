  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Big typography background -->
  <text x="-200" y="800" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="600" font-weight="900" fill="white" opacity="0.03" transform="rotate(-15 1200 1800)">
