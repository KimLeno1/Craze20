<svg width="1200" height="628" viewBox="0 0 1200 628" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="text-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D1FF" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Decorative Circles -->
  <circle cx="1000" cy="-50" r="300" fill="#00D1FF" opacity="0.15" filter="url(#glow)"/>
  <circle cx="150" cy="550" r="250" fill="#EC4899" opacity="0.15" filter="url(#glow)"/>
  
  <!-- Content -->
  <text x="100" y="220" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="72" font-weight="900" fill="white">
    ELEVATE YOUR STYLE.
  </text>
  <text x="100" y="320" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="84" font-weight="900" fill="url(#text-gradient)">
    OWN THE KRAZE.
  </text>
  
  <text x="100" y="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#9ca3af">
    The next generation of fashion &amp; social commerce.
  </text>
  <text x="100" y="440" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#9ca3af">
    Earn rewards, sponsor friends, and discover unique drips.
  </text>

  <!-- CTA Button -->
  <rect x="100" y="500" width="240" height="60" rx="30" fill="#00D1FF" />
  <text x="220" y="538" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="bold" fill="#020617" text-anchor="middle">
    SHOP NOW
  </text>
</svg>
